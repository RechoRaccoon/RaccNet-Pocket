name: Build Stellar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Stellar APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      # Stellar's own signing key (CN=Stellar, alias "stellar"). The
      # applicationId is rechoraccoon.stellar, so this installs as its own
      # app alongside/in place of the old RaccNet Lite package.
      - name: Sign APK with committed keystore
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign \
            --ks stellar-release.jks \
            --ks-key-alias stellar \
            --ks-pass pass:Stellar2026 \
            --key-pass pass:Stellar2026 \
            --out app/build/outputs/apk/release/Stellar.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stellar-APK
          path: app/build/outputs/apk/release/Stellar.apk
          retention-days: 90
