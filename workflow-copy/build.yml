name: Build Stellar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Stellar APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        run: gradle :androidApp:assembleRelease --stacktrace

      # Release signing key comes from GitHub Actions secrets
      # (STELLAR_KEYSTORE_B64, STELLAR_KEYSTORE_PASSWORD, STELLAR_KEY_ALIAS).
      # Never commit a keystore or password to the repo.
      - name: Sign APK with release key
        env:
          KEYSTORE_B64: ${{ secrets.STELLAR_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STELLAR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STELLAR_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > /tmp/stellar-release.p12
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign \
            --ks /tmp/stellar-release.p12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEYSTORE_PASSWORD" \
            --out androidApp/build/outputs/apk/release/Stellar.apk \
            androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk
          rm -f /tmp/stellar-release.p12

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stellar-APK
          path: androidApp/build/outputs/apk/release/Stellar.apk
          retention-days: 90
