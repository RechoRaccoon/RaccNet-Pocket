name: Build Stellar iOS

# Separate from build.yml so an iOS failure never blocks the Android APK.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ios:
    name: Build unsigned iOS app
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Build Kotlin frameworks (device + simulator)
        run: gradle :shared:linkReleaseFrameworkIosArm64 :shared:linkReleaseFrameworkIosSimulatorArm64 --stacktrace

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Build unsigned device app (.ipa)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/ios/Build/Products/Release-iphoneos/Stellar.app Payload/
          zip -qry Stellar-unsigned.ipa Payload

      - name: Build simulator app (for Appetize.io)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-sim \
            CODE_SIGNING_ALLOWED=NO build
          cd build/ios-sim/Build/Products/Release-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/Stellar-simulator.zip" Stellar.app

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Stellar-iOS-unsigned
          path: Stellar-unsigned.ipa
          retention-days: 30

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Stellar-iOS-simulator
          path: Stellar-simulator.zip
          retention-days: 30
