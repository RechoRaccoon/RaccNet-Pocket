# Central dependency versions for the RaccNet Pocket KMP migration.
#
# Mapping from the legacy Android-only stack (see README "Dependency mapping"):
#   Retrofit/OkHttp/Gson        -> ktor-client-* + kotlinx-serialization
#   Coil 2 (coil-compose)       -> coil3 coil-compose (multiplatform)
#   DataStore preferences       -> multiplatform-settings
#   media3 ExoPlayer (Android)  -> expect/actual PlatformVideoPlayer
#   WorkManager (Android)       -> expect/actual PlatformDownloader
#   ML Kit Translate (Android)  -> expect/actual PlatformTranslator
#   onnxruntime-android         -> expect/actual PlatformImageTagger
#   Android WebView             -> expect/actual WebEmbed
#
# NOTE (2026-09-10): versions chosen from public release knowledge; dependency
# resolution was NOT verified in this environment (the sandbox blocks the
# direct network connections Gradle's Java HTTP client needs, so plugin and
# library downloads never completed). First full resolve happens in CI. If a
# version fails to resolve, prefer the newest stable of the same artifact.
#
# CORRECTIONS (2026-09-10, verified against Maven Central):
# - multiplatform-settings: 1.3.7 does not exist -> pinned to 1.3.0 (latest).
# - material-icons-extended: discontinued by JetBrains after 1.7.3 -> pinned
#   to 1.7.3 (official guidance; the compose plugin does the same internally).
#   Longer term, migrate icon usage to Material Symbols.

[versions]
kotlin = "2.2.0"
compose-multiplatform = "1.9.0"
agp = "8.7.3"

ktor = "3.1.0"
kotlinx-coroutines = "1.10.2"
kotlinx-serialization = "1.8.1"
kotlinx-datetime = "0.6.2"
multiplatform-settings = "1.3.0"
coil3 = "3.2.0"

# Android-only actuals (kept from the legacy app)
media3 = "1.3.0"
onnxruntime-android = "1.18.0"
mlkit-translate = "17.0.3"
mlkit-language-id = "17.0.6"
androidx-activity = "1.8.2"
androidx-core = "1.12.0"

[libraries]
# --- commonMain ---
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatform-settings" }
multiplatform-settings-coroutines = { module = "com.russhwolf:multiplatform-settings-coroutines", version.ref = "multiplatform-settings" }
coil3-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil3" }
coil3-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil3" }
# DOM bindings for wasmJs (document/window/localStorage/fetch). May arrive
# transitively via compose.ui, but declare explicitly so both wasmJs source
# sets compile regardless of the scope JetBrains publishes it with.
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version = "0.3" }
# NOTE: JetBrains discontinued material-icons-extended after 1.7.3 (the artifact
# is intentionally pinned there; newer versions are never published). The compose
# plugin's own materialIconsExtended accessor pins to 1.7.3 for the same reason.
# Do NOT tie this to version.ref = "compose-multiplatform".
compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version = "1.7.3" }
compose-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "compose-multiplatform" }

# --- androidMain actuals (legacy deps, kept) ---
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime-android" }
mlkit-translate = { module = "com.google.mlkit:translate", version.ref = "mlkit-translate" }
mlkit-language-id = { module = "com.google.mlkit:language-id", version.ref = "mlkit-language-id" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
