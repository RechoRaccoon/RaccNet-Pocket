<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <title>RaccNet Pocket</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        body { display: flex; }
        canvas { display: block; }
        #loading {
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
            color: #888; font-family: system-ui, sans-serif; font-size: 14px;
            background: #000; z-index: 10;
        }
    </style>
</head>
<body>
    <div id="loading">Loading RaccNet Pocket…</div>
    <script>
        // Hide the splash once Compose has painted its first frame.
        new MutationObserver(function (mutations, obs) {
            if (document.querySelector('canvas')) {
                var el = document.getElementById('loading');
                if (el) el.remove();
                obs.disconnect();
            }
        }).observe(document.body, { childList: true });
    </script>
    <script src="raccnet-pocket.js"></script>
</body>
</html>
